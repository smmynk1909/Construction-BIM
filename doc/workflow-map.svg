<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" role="img" aria-label="Cross functional workflow map"><title>Cross functional workflow map</title><desc>Three connected journeys with decisions and evidence. Each handoff carries record IDs, revision, owner and due date.</desc><style>text{font-family:Arial,sans-serif} line,path{stroke:#81939e;stroke-width:2;fill:none}</style><rect width="1500" height="1020" fill="#f6f8fa"/><text x="750" y="43" text-anchor="middle" font-size="24" fill="#172b3a">Three connected workflows from sale to sustained service</text><text x="60" y="115" text-anchor="start" font-size="20" fill="#172b3a">Commercial journey</text><path d="M 253 170 H 277 l -7 -5 m 7 5 l -7 5"/><rect x="36.5" y="132.5" width="217" height="75" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="145" y="165" text-anchor="middle" font-size="16" fill="#172b3a">Sales: qualify and bid</text><text x="145" y="189" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 493 170 H 517 l -7 -5 m 7 5 l -7 5"/><rect x="276.5" y="132.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="385" y="165" text-anchor="middle" font-size="16" fill="#172b3a">Commercial: contract</text><text x="385" y="189" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 733 170 H 757 l -7 -5 m 7 5 l -7 5"/><rect x="516.5" y="132.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="625" y="165" text-anchor="middle" font-size="16" fill="#172b3a">Delivery: fulfil promises</text><text x="625" y="189" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 973 170 H 997 l -7 -5 m 7 5 l -7 5"/><rect x="756.5" y="132.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="865" y="165" text-anchor="middle" font-size="16" fill="#172b3a">Accounting: bill client</text><text x="865" y="189" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 1213 170 H 1237 l -7 -5 m 7 5 l -7 5"/><rect x="996.5" y="132.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="1105" y="165" text-anchor="middle" font-size="16" fill="#172b3a">Finance: collect cash</text><text x="1105" y="189" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><rect x="1236.5" y="132.5" width="217" height="75" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="1345" y="165" text-anchor="middle" font-size="16" fill="#172b3a">Sales: renew service</text><text x="1345" y="189" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><text x="60" y="252" text-anchor="start" font-size="16" fill="#172b3a">Award creates owned obligations; collection, revenue and contract value remain separate.</text><text x="60" y="355" text-anchor="start" font-size="20" fill="#172b3a">Project and supply journey</text><path d="M 253 410 H 277 l -7 -5 m 7 5 l -7 5"/><rect x="36.5" y="372.5" width="217" height="75" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="145" y="405" text-anchor="middle" font-size="16" fill="#172b3a">Engineering: release</text><text x="145" y="429" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 493 410 H 517 l -7 -5 m 7 5 l -7 5"/><rect x="276.5" y="372.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="385" y="405" text-anchor="middle" font-size="16" fill="#172b3a">Planning: baseline</text><text x="385" y="429" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 733 410 H 757 l -7 -5 m 7 5 l -7 5"/><rect x="516.5" y="372.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="625" y="405" text-anchor="middle" font-size="16" fill="#172b3a">Procurement: PR and PO</text><text x="625" y="429" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 973 410 H 997 l -7 -5 m 7 5 l -7 5"/><rect x="756.5" y="372.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="865" y="405" text-anchor="middle" font-size="16" fill="#172b3a">Stores/QHSE: accept</text><text x="865" y="429" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 1213 410 H 1237 l -7 -5 m 7 5 l -7 5"/><rect x="996.5" y="372.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="1105" y="405" text-anchor="middle" font-size="16" fill="#172b3a">Site: verify progress</text><text x="1105" y="429" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><rect x="1236.5" y="372.5" width="217" height="75" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="1345" y="405" text-anchor="middle" font-size="16" fill="#172b3a">Accounting: match/post</text><text x="1345" y="429" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><text x="60" y="492" text-anchor="start" font-size="16" fill="#172b3a">Approved design/BOQ/budget/plan are prerequisites; exceptions and changes return to owners.</text><text x="60" y="595" text-anchor="start" font-size="20" fill="#172b3a">Asset and service journey</text><path d="M 253 650 H 277 l -7 -5 m 7 5 l -7 5"/><rect x="36.5" y="612.5" width="217" height="75" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="145" y="645" text-anchor="middle" font-size="16" fill="#172b3a">Design: asset needs</text><text x="145" y="669" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 493 650 H 517 l -7 -5 m 7 5 l -7 5"/><rect x="276.5" y="612.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="385" y="645" text-anchor="middle" font-size="16" fill="#172b3a">Commission: test</text><text x="385" y="669" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 733 650 H 757 l -7 -5 m 7 5 l -7 5"/><rect x="516.5" y="612.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="625" y="645" text-anchor="middle" font-size="16" fill="#172b3a">Operations: accept</text><text x="625" y="669" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 973 650 H 997 l -7 -5 m 7 5 l -7 5"/><rect x="756.5" y="612.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="865" y="645" text-anchor="middle" font-size="16" fill="#172b3a">Maintenance: plan</text><text x="865" y="669" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><path d="M 1213 650 H 1237 l -7 -5 m 7 5 l -7 5"/><rect x="996.5" y="612.5" width="217" height="75" rx="7" fill="#ffffff" stroke="#81939e"/><text x="1105" y="645" text-anchor="middle" font-size="16" fill="#172b3a">Technician: work/test</text><text x="1105" y="669" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><rect x="1236.5" y="612.5" width="217" height="75" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="1345" y="645" text-anchor="middle" font-size="16" fill="#172b3a">Operations: restore</text><text x="1345" y="669" text-anchor="middle" font-size="12" fill="#172b3a">Evidence + authorised decision</text><text x="60" y="732" text-anchor="start" font-size="16" fill="#172b3a">Operating requirements start during design; failed tests or critical holds block service release.</text><text x="750" y="935" text-anchor="middle" font-size="17" fill="#172b3a">All journeys share locations, packages, quantities, cost accounts, revisions, assets and the audit trail.</text><text x="750" y="970" text-anchor="middle" font-size="16" fill="#172b3a">See WF01–WF10 for states, rejection loops, authority, dependencies and exception handling.</text></svg>
