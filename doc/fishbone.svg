<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-label="Fishbone risk and control map"><title>Fishbone risk and control map</title><desc>Possible causes of unreliable lifecycle outcomes and corresponding control families. These are design hypotheses, not measured root causes.</desc><style>text{font-family:Arial,sans-serif} line,path{stroke:#81939e;stroke-width:2;fill:none}</style><rect width="1500" height="850" fill="#f6f8fa"/><text x="750" y="45" text-anchor="middle" font-size="24" fill="#172b3a">Fishbone map of lifecycle delivery and service risk</text><text x="750" y="76" text-anchor="middle" font-size="16" fill="#172b3a">Read each branch as a possible cause and the controls intended to address it.</text><line x1="90" y1="420" x2="1200" y2="420"/><rect x="1205.0" y="355.0" width="250" height="130" rx="7" fill="#e2f0ee" stroke="#81939e"/><text x="1330" y="415" text-anchor="middle" font-size="16" fill="#172b3a">Unreliable outcomes</text><text x="1330" y="439" text-anchor="middle" font-size="12" fill="#172b3a">Cost • schedule • cash • service</text><line x1="260" y1="420" x2="150" y2="155"/><text x="130" y="127" text-anchor="start" font-size="18" fill="#172b3a">People and accountability</text><text x="130" y="170" text-anchor="start" font-size="14" fill="#172b3a">Unclear decision rights</text><text x="130" y="203" text-anchor="start" font-size="14" fill="#172b3a">Controls: RACI and authority</text><text x="130" y="236" text-anchor="start" font-size="14" fill="#172b3a">Named owners and training</text><line x1="610" y1="420" x2="500" y2="155"/><text x="480" y="127" text-anchor="start" font-size="18" fill="#172b3a">Data and information</text><text x="480" y="170" text-anchor="start" font-size="14" fill="#172b3a">Conflicting or stale revisions</text><text x="480" y="203" text-anchor="start" font-size="14" fill="#172b3a">Controls: CDE and source owners</text><text x="480" y="236" text-anchor="start" font-size="14" fill="#172b3a">Validation and reconciliation</text><line x1="960" y1="420" x2="850" y2="155"/><text x="830" y="127" text-anchor="start" font-size="18" fill="#172b3a">Planning and delivery</text><text x="830" y="170" text-anchor="start" font-size="14" fill="#172b3a">Late constraints and changes</text><text x="830" y="203" text-anchor="start" font-size="14" fill="#172b3a">Controls: logic and readiness</text><text x="830" y="236" text-anchor="start" font-size="14" fill="#172b3a">Evidence and impact review</text><line x1="260" y1="420" x2="150" y2="690"/><text x="130" y="718" text-anchor="start" font-size="18" fill="#172b3a">Commercial and finance</text><text x="130" y="615" text-anchor="start" font-size="14" fill="#172b3a">Promises or costs untracked</text><text x="130" y="648" text-anchor="start" font-size="14" fill="#172b3a">Controls: contract obligations</text><text x="130" y="681" text-anchor="start" font-size="14" fill="#172b3a">Budget and ledger separation</text><line x1="610" y1="420" x2="500" y2="690"/><text x="480" y="718" text-anchor="start" font-size="18" fill="#172b3a">Supply and quality</text><text x="480" y="615" text-anchor="start" font-size="14" fill="#172b3a">Wrong or unaccepted material</text><text x="480" y="648" text-anchor="start" font-size="14" fill="#172b3a">Controls: traceable receipts</text><text x="480" y="681" text-anchor="start" font-size="14" fill="#172b3a">Inspection and invoice match</text><line x1="960" y1="420" x2="850" y2="690"/><text x="830" y="718" text-anchor="start" font-size="18" fill="#172b3a">Operations and maintenance</text><text x="830" y="615" text-anchor="start" font-size="14" fill="#172b3a">Incomplete readiness or upkeep</text><text x="830" y="648" text-anchor="start" font-size="14" fill="#172b3a">Controls: tested handover</text><text x="830" y="681" text-anchor="start" font-size="14" fill="#172b3a">Service plans and work orders</text><text x="750" y="805" text-anchor="middle" font-size="16" fill="#172b3a">Validate causes through interviews and transaction evidence. This diagram is diagnostic, not a workflow.</text></svg>
